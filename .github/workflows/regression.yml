name: NBA Regression Validation

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Full Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate synthetic customer data
        run: |
          python -m src.synthetic_data

      - name: Build SQLite customer database
        run: |
          python -m src.load_customers_to_sqlite

      - name: Create CI report directory
        run: |
          mkdir -p reports/ci

      - name: Run full regression suite
        run: |
          python -m pytest -q --junitxml=reports/ci/pytest-junit.xml

      - name: Upload JUnit regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-regression-junit
          path: reports/ci/pytest-junit.xml
          if-no-files-found: error